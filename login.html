<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login – SPKL Padalarang</title>
    <meta name="description" content="Login ke aplikasi SPKL Padalarang – PT. Haleyora Power" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ── Design Tokens ──────────────────────────────────── */
      :root {
        --primary:       #0284c7;
        --primary-dark:  #0369a1;
        --accent:        #0d9488;
        --bg-color:      #f8fafc;
        --text-main:     #0f172a;
        --text-muted:    #64748b;
        --glass-bg:      rgba(255, 255, 255, 0.7);
        --glass-border:  rgba(255, 255, 255, 0.8);
        --shadow-color:  rgba(15, 23, 42, 0.08);
      }

      /* ── Reset ──────────────────────────────────────────── */
      *, *::before, *::after {
        margin: 0; padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Body / Background ──────────────────────────────── */
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-color);
        background-image:
          radial-gradient(circle at 15% 50%, rgba(2, 132, 199, 0.08), transparent 50%),
          radial-gradient(circle at 85% 20%, rgba(13, 148, 136, 0.08), transparent 50%),
          radial-gradient(circle at 60% 80%, rgba(2, 132, 199, 0.05), transparent 40%);
        background-attachment: fixed;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* ── Floating blobs ─────────────────────────────────── */
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.18;
        pointer-events: none;
        z-index: 0;
      }
      .blob-1 { width: 340px; height: 340px; background: #0284c7; top: -80px; left: -80px; }
      .blob-2 { width: 280px; height: 280px; background: #0d9488; bottom: -60px; right: -60px; }
      .blob-3 { width: 200px; height: 200px; background: #7c3aed; top: 50%; left: 65%; }

      /* ── Login wrapper ──────────────────────────────────── */
      .login-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* ── Glass card ─────────────────────────────────────── */
      .login-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: 40px 36px 36px;
        box-shadow:
          0 8px 32px var(--shadow-color),
          0 1px 0 rgba(255,255,255,0.9) inset;
      }

      /* ── Logo / Brand ───────────────────────────────────── */
      .brand {
        text-align: center;
        margin-bottom: 36px;
      }

      .brand-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .brand h1 {
        font-size: 1.6rem;
        font-weight: 700;
        background: linear-gradient(to right, #0284c7, #0d9488);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
      }

      .brand p {
        font-size: 0.82rem;
        color: var(--text-muted);
        font-weight: 500;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ── Form title ─────────────────────────────────────── */
      .form-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 24px;
        text-align: center;
      }

      /* ── Form groups ────────────────────────────────────── */
      .form-group {
        margin-bottom: 20px;
        position: relative;
      }

      label {
        display: block;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      /* Input wrapper with icon */
      .input-wrapper {
        position: relative;
      }

      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px; height: 18px;
        stroke: var(--text-muted); stroke-width: 2;
        fill: none;
        pointer-events: none;
        transition: stroke 0.3s;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 14px 16px 14px 44px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
      }

      input[type="text"]:focus + .input-icon,
      input[type="password"]:focus + .input-icon,
      .input-wrapper:focus-within .input-icon {
        stroke: var(--primary);
      }

      input::placeholder { color: #94a3b8; }

      /* Toggle password visibility */
      .toggle-pw {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: var(--text-muted);
        transition: color 0.2s;
        display: flex;
        align-items: center;
      }
      .toggle-pw:hover { color: var(--primary); }
      .toggle-pw svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }

      /* ── Remember me row ────────────────────────────────── */
      .extras {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        margin-top: -4px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 0.82rem;
        color: var(--text-muted);
        font-weight: 500;
        user-select: none;
      }

      .remember input[type="checkbox"] {
        width: 16px;
        height: 16px;
        padding: 0;
        margin: 0;
        border-radius: 4px;
        border: 1px solid #cbd5e1;
        accent-color: var(--primary);
        box-shadow: none;
        cursor: pointer;
      }

      .forgot-link {
        font-size: 0.82rem;
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .forgot-link:hover { opacity: 0.75; }

      /* ── Primary button ─────────────────────────────────── */
      .btn-primary {
        width: 100%;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        letter-spacing: 0.3px;
      }

      .btn-primary:hover {
        box-shadow: 0 8px 20px rgba(2, 132, 199, 0.45);
        transform: translateY(-1px);
      }
      .btn-primary:active {
        transform: scale(0.98);
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      }

      /* ripple shimmer on button */
      .btn-primary::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
        transform: translateX(-100%);
        transition: transform 0.5s;
      }
      .btn-primary:hover::after { transform: translateX(100%); }

      /* ── Spinner ────────────────────────────────────────── */
      .spinner {
        width: 20px; height: 20px;
        border: 2.5px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s ease-in-out infinite;
      }
      .hidden { display: none !important; }

      /* ── Divider ────────────────────────────────────────── */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 28px 0 20px;
      }
      .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }
      .divider span {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* ── Footer note ────────────────────────────────────── */
      .footer-note {
        text-align: center;
        margin-top: 28px;
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      /* ── Error / success state ──────────────────────────── */
      .error-msg {
        display: none;
        align-items: center;
        gap: 8px;
        background: rgba(225, 29, 72, 0.08);
        border: 1px solid rgba(225, 29, 72, 0.2);
        color: #be123c;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 20px;
        animation: slideUpFade 0.3s ease forwards;
      }
      .error-msg.show { display: flex; }
      .error-msg svg { width: 16px; height: 16px; stroke: #be123c; stroke-width: 2; fill: none; flex-shrink: 0; }

      .input-wrapper.invalid input {
        border-color: #f43f5e;
        box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.12);
      }

      /* ── Animations ─────────────────────────────────────── */
      @keyframes slideUpFade {
        0%   { opacity: 0; transform: translateY(24px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-icon {
        0%, 100% { box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35); }
        50%       { box-shadow: 0 8px 32px rgba(2, 132, 199, 0.55); }
      }

      /* ── Toast ──────────────────────────────────────────── */
      .toast {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: rgba(13, 148, 136, 0.95);
        backdrop-filter: blur(10px);
        color: #fff;
        padding: 14px 28px;
        border-radius: 40px;
        font-size: 0.9rem;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(13, 148, 136, 0.3);
        z-index: 1000;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.error {
        background: rgba(225, 29, 72, 0.95);
        box-shadow: 0 10px 30px rgba(225, 29, 72, 0.3);
      }
    </style>
  </head>
  <body>

    <!-- Decorative blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Login Card -->
    <div class="login-wrapper">
      <div class="login-card">

        <!-- Brand -->
        <div class="brand">
          <div class="brand-icon">
            <img src="./Logo SPKL.png" alt="Logo SPKL">
          </div>
        </div>

        <!-- Form title -->
        <p class="form-title">Masuk ke Akun Anda</p>

        <!-- DB Status indicator -->
        <div id="db-status" style="display:none; align-items:center; gap:8px; border:1px solid; border-radius:10px; padding:10px 14px; font-size:0.82rem; font-weight:600; margin-bottom:16px; transition:all 0.3s;"></div>

        <!-- Error message -->
        <div class="error-msg" id="error-msg">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span id="error-text">Username atau password salah.</span>
        </div>

        <!-- Login Form Container (menggunakan div untuk mencegah Chrome Password Manager popup) -->
        <div id="login-form">

          <!-- NIP -->
          <div class="form-group">
            <label for="username">NIP</label>
            <div class="input-wrapper" id="wrap-username">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Masukkan NIP..."
                autocomplete="off"
                required
              />
              <svg class="input-icon" viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </div>
            <!-- Preview nama petugas -->
            <div id="nama-preview" style="display:none; margin-top:8px; padding:10px 14px; background:rgba(2,132,199,0.07); border:1px solid rgba(2,132,199,0.2); border-radius:10px; font-size:0.88rem; color:#0369a1; font-weight:600; display:flex; align-items:center; gap:8px;">
              <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#0369a1;stroke-width:2.5;fill:none;flex-shrink:0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span id="nama-preview-text"></span>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper" id="wrap-password" style="position: relative;">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password..."
                autocomplete="new-password"
                required
              />
              <svg class="input-icon" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <!-- Toggle visibility -->
              <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Tampilkan password">
                <svg id="eye-icon" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember & Forgot -->
          <div class="extras">
            <label class="remember">
              <input type="checkbox" id="remember-me" />
              Ingat saya
            </label>
            <a href="#" class="forgot-link" id="forgot-link">Lupa password?</a>
          </div>

          <!-- Submit -->
          <button type="button" class="btn-primary" id="btn-login">
            <span id="btn-label">Masuk</span>
            <div class="spinner hidden" id="spinner"></div>
          </button>

        </div>

        <!-- Footer -->
        <p class="footer-note">
          &copy; 2025 PT. Haleyora Power &mdash; ULP Padalarang<br>
          Hubungi admin jika mengalami kendala login.
        </p>

      </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast">
      <span id="toast-msg"></span>
    </div>

    <script>
      // ══════════════════════════════════════════════════════
      //  KONFIGURASI — Isi URL Apps Script setelah di-deploy
      // ══════════════════════════════════════════════════════
      // Langkah deploy ada di file: PetugasAPI.gs
      // Setelah dapat URL, paste di bawah ini (ganti teks PASTE_URL_DI_SINI)
      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4UZRJBBUnARVBC7GOb182qBCcjnxSUIoMHU0d2Ofouj9FED-53h67PbzMtOeuRuRu/exec';

      // ── ID & nama sheet (tidak perlu diubah) ─────────────
      const SHEET_ID   = '1YiXREQJ4Xl39L1N6-FjPY40YoqZZcyCNLnEPi5drIJ4';
      const SHEET_NAME = 'Petugas';

      // ── Data petugas ──────────────────────────────────────
      let USERS       = [];
      let usersLoaded = false;

      // ── Konversi raw row → objek user ────────────────────
      function makeUser(nip, pwd, nama, jabatan, penempatan, role) {
        return {
          username:    String(nip).trim(),
          password:    String(pwd).trim(),
          displayName: String(nama || '').trim(),
          jabatan:     String(jabatan || '').trim(),
          penempatan:  String(penempatan || '').trim(),
          role:        String(role || 'operator').trim().toLowerCase()
        };
      }

      // ── Metode 1: Apps Script via JSONP (bekerja dari file://) ──────
      function loadViaAppsScript() {
        return new Promise((resolve) => {
          let scriptUrl = localStorage.getItem('spkl_script_url') || APPS_SCRIPT_URL;
          if (!scriptUrl || scriptUrl === 'PASTE_URL_DI_SINI') { resolve(false); return; }

          const cbName = '_gasCb_' + Date.now();
          const url    = scriptUrl + '?action=getUsers&callback=' + cbName;
          const timer  = setTimeout(() => { cleanup(); resolve(false); }, 5000);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (sc && sc.parentNode) sc.parentNode.removeChild(sc);
          }

          window[cbName] = function(json) {
            cleanup();
            try {
              if (json.status === 'success' && Array.isArray(json.data) && json.data.length > 0) {
                USERS = json.data
                  .filter(u => u.username && u.password)
                  .map(u => makeUser(u.username, u.password, u.nama, u.jabatan, u.penempatan, u.role));
                usersLoaded = USERS.length > 0;
                resolve(usersLoaded);
              } else {
                resolve(false);
              }
            } catch(e) { console.warn('GAS JSONP parse error:', e); resolve(false); }
          };

          const sc = document.createElement('script');
          sc.src = url;
          sc.onerror = () => { cleanup(); resolve(false); };
          document.head.appendChild(sc);
        });
      }

      // ── Metode 2: Google Visualization JSONP ─────────────────────────
      // gviz selalu pakai google.visualization.Query.setResponse() sebagai
      // wrapper, bukan callback=xxx — jadi kita intercept method tersebut.
      function loadViaGviz() {
        return new Promise((resolve) => {
          const url   = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
                      + '/gviz/tq?tqx=out:json&tq=' + encodeURIComponent('SELECT A,B,C,D,E,F')
                      + '&sheet=' + encodeURIComponent(SHEET_NAME);
          const timer = setTimeout(() => { cleanup(); resolve(false); }, 12000);
          let sc;

          function cleanup() {
            clearTimeout(timer);
            // Restore google.visualization jika ada
            if (window._origGvizResp) {
              if (!window.google) window.google = {};
              if (!window.google.visualization) window.google.visualization = {};
              if (!window.google.visualization.Query) window.google.visualization.Query = {};
              window.google.visualization.Query.setResponse = window._origGvizResp;
              delete window._origGvizResp;
            }
            if (sc && sc.parentNode) sc.parentNode.removeChild(sc);
          }

          // Siapkan namespace google.visualization.Query
          if (!window.google) window.google = {};
          if (!window.google.visualization) window.google.visualization = {};
          if (!window.google.visualization.Query) window.google.visualization.Query = {};

          // Simpan method asli (jika ada)
          window._origGvizResp = window.google.visualization.Query.setResponse || null;

          // Intercept: gviz akan panggil method ini saat script dimuat
          window.google.visualization.Query.setResponse = function(data) {
            cleanup();
            try {
              const rows = (data && data.table && data.table.rows) || [];
              const tmp  = rows.map(row => {
                const c   = row.c || [];
                const nip = c[0] && c[0].v != null ? String(c[0].v).trim() : '';
                const pwd = c[1] && c[1].v != null ? String(c[1].v).trim() : '';
                // Skip baris header
                if (!nip || !pwd) return null;
                if (nip.toLowerCase() === 'nip' || pwd.toLowerCase() === 'password') return null;
                return makeUser(
                  nip, pwd,
                  c[2] && c[2].v != null ? c[2].v : '',
                  c[3] && c[3].v != null ? c[3].v : '',
                  c[4] && c[4].v != null ? c[4].v : '',
                  c[5] && c[5].v != null ? c[5].v : 'operator'
                );
              }).filter(Boolean);
              if (tmp.length > 0) {
                USERS = tmp; usersLoaded = true; resolve(true);
              } else { resolve(false); }
            } catch(e) { console.error('gviz parse error:', e); resolve(false); }
          };

          sc = document.createElement('script');
          sc.src = url;
          sc.onerror = () => { cleanup(); resolve(false); };
          document.head.appendChild(sc);
        });
      }

      // ── loadUsers: gviz dulu (langsung dari spreadsheet), GAS fallback ──
      async function loadUsers() {
        setDbStatus('loading');
        // Metode 1: gviz JSONP – langsung baca dari Google Spreadsheet
        // Tidak bergantung pada GAS deployment, pasti berhasil selama
        // spreadsheet dibagikan "Anyone with the link can view"
        const ok1 = await loadViaGviz();
        if (ok1) { setDbStatus('ok'); return; }
        // Metode 2: Apps Script JSONP (fallback jika gviz gagal)
        const ok2 = await loadViaAppsScript();
        if (ok2) { setDbStatus('ok'); return; }
        // Semua gagal
        usersLoaded = false;
        setDbStatus('error');
      }

      // ── Status indikator database ────────────────────────
      function setDbStatus(state) {
        const bar = document.getElementById('db-status');
        if (!bar) return;
        if (state === 'loading') {
          bar.style.display = 'flex';
          bar.style.background = 'rgba(245,158,11,0.08)';
          bar.style.borderColor = 'rgba(245,158,11,0.3)';
          bar.style.color = '#d97706';
          bar.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;animation:spin 1s linear infinite;flex-shrink:0"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg><span>Memuat data petugas...</span>';
        } else if (state === 'ok') {
          bar.style.display = 'flex';
          bar.style.background = 'rgba(16,185,129,0.07)';
          bar.style.borderColor = 'rgba(16,185,129,0.25)';
          bar.style.color = '#059669';
          bar.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;stroke-width:2.5;fill:none;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg><span>Database terhubung · ' + USERS.length + ' petugas</span>';
          setTimeout(() => { bar.style.display = 'none'; }, 3000);
        } else {
          bar.style.display = 'flex';
          bar.style.background = 'rgba(225,29,72,0.07)';
          bar.style.borderColor = 'rgba(225,29,72,0.2)';
          bar.style.color = '#be123c';
          bar.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>Gagal memuat database — periksa koneksi internet</span>';
        }
      }

      // ── Elements ─────────────────────────────────────────
      const form       = document.getElementById('login-form');
      const usernameEl = document.getElementById('username');
      const passwordEl = document.getElementById('password');
      const btnLabel   = document.getElementById('btn-label');
      const spinner    = document.getElementById('spinner');
      const btnLogin   = document.getElementById('btn-login');
      const errorMsg   = document.getElementById('error-msg');
      const errorText  = document.getElementById('error-text');
      const wrapUser   = document.getElementById('wrap-username');
      const wrapPass   = document.getElementById('wrap-password');
      const togglePw   = document.getElementById('toggle-pw');
      const eyeIcon    = document.getElementById('eye-icon');
      const remember   = document.getElementById('remember-me');

      // Eye icons SVG paths
      const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

      // ── Muat data petugas saat halaman dibuka ────────────
      loadUsers().then(() => {
        if (!usersLoaded) {
          showToast('Gagal memuat data petugas. Periksa koneksi.', false);
        }
      });

      // ── Restore remembered NIP ────────────────────────────
      const savedUser = localStorage.getItem('spkl_login_user');
      if (savedUser) {
        usernameEl.value = savedUser;
        remember.checked = true;
        // Tampilkan preview nama jika NIP sudah tersimpan
        setTimeout(() => showNamaPreview(savedUser), 1200);
      }

      // ── Toggle password visibility ────────────────────────
      togglePw.addEventListener('click', () => {
        const isHidden = passwordEl.type === 'password';
        passwordEl.type = isHidden ? 'text' : 'password';
        eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
        togglePw.setAttribute('aria-label', isHidden ? 'Sembunyikan password' : 'Tampilkan password');
      });

      // ── Preview nama saat user mengetik NIP ──────────────
      function showNamaPreview(nip) {
        const preview  = document.getElementById('nama-preview');
        const previewTxt = document.getElementById('nama-preview-text');
        if (!nip || !usersLoaded) { preview.style.display = 'none'; return; }
        const found = USERS.find(u => u.username.toLowerCase() === nip.toLowerCase());
        if (found && found.displayName) {
          previewTxt.textContent = found.displayName;
          preview.style.display = 'flex';
        } else {
          preview.style.display = 'none';
        }
      }

      usernameEl.addEventListener('input', () => {
        showNamaPreview(usernameEl.value.trim());
      });

      // ── Clear error on input ──────────────────────────────
      [usernameEl, passwordEl].forEach(el => {
        el.addEventListener('input', () => {
          errorMsg.classList.remove('show');
          wrapUser.classList.remove('invalid');
          wrapPass.classList.remove('invalid');
        });
      });

      // ── Forgot password hint ──────────────────────────────
      document.getElementById('forgot-link').addEventListener('click', e => {
        e.preventDefault();
        showToast('Hubungi admin untuk reset password.', false);
      });

      // ── Form submit ───────────────────────────────────────
      async function handleLogin() {
        const uVal = usernameEl.value.trim();
        const pVal = passwordEl.value;

        // Basic empty check
        if (!uVal || !pVal) {
          showError('NIP dan password tidak boleh kosong.');
          if (!uVal) wrapUser.classList.add('invalid');
          if (!pVal) wrapPass.classList.add('invalid');
          return;
        }

        // Loading state
        btnLabel.classList.add('hidden');
        spinner.classList.remove('hidden');
        btnLogin.disabled = true;

        // Jika data belum termuat, coba muat ulang
        if (!usersLoaded || USERS.length === 0) {
          showToast('Memuat data petugas...', true);
          await loadUsers();
          if (!usersLoaded) {
            btnLabel.classList.remove('hidden');
            spinner.classList.add('hidden');
            btnLogin.disabled = false;
            showError('Gagal terhubung ke database. Periksa koneksi internet.');
            return;
          }
        }

        // Simulate short auth delay for UX
        await new Promise(r => setTimeout(r, 700));

        // Find user
        let user = null;
        const scriptUrl = localStorage.getItem('spkl_script_url');
        
        if (scriptUrl) {
          try {
            const response = await fetch(scriptUrl + "?action=getPetugas");
            const result = await response.json();
            
            if (result.status === 'success' && Array.isArray(result.data)) {
              // result.data adalah array user dari Google Sheet
              user = result.data.find(u => 
                (u.username.toLowerCase() === uVal.toLowerCase() || 
                 (u.noInduk && u.noInduk.toLowerCase() === uVal.toLowerCase()) || 
                 (u.nama && u.nama.toLowerCase() === uVal.toLowerCase())) 
                && u.password === pVal
              );
              
              if (user) {
                // Pastikan ada displayName (diambil dari nama) untuk kompatibilitas frontend
                user.displayName = user.nama || user.username;
              }
            }
          } catch (error) {
            console.error("Gagal mengambil data login dari Google Sheet:", error);
            // Jika gagal, biarkan user = null agar pindah ke fallback
          }
        }

        // Fallback ke hardcoded USERS jika tidak ditemukan di DB atau scriptUrl kosong/gagal
        if (!user) {
          user = USERS.find(u =>
            u.username.toLowerCase() === uVal.toLowerCase() && u.password === pVal
          );
        }

        if (user) {
          // Simpan sesi (termasuk data lengkap dari database)
          sessionStorage.setItem('spkl_auth', JSON.stringify({
            username:    user.username,
            noInduk:     user.noInduk || user.username,
            displayName: user.displayName || user.nama || user.username,
            nama:        user.nama || user.displayName || user.username,
            jabatan:     user.jabatan     || '',
            penempatan:  user.penempatan  || '',
            role:        user.role        || 'operator',
            loginAt:     Date.now()
          }));

          // Otomatis simpan URL Google Script ke localStorage saat login
          // Ini memastikan semua user (koordinator, TL, operator) punya URL tersimpan
          // tanpa perlu manual isi di halaman Pengaturan
          if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'PASTE_URL_DI_SINI') {
            localStorage.setItem('spkl_script_url', APPS_SCRIPT_URL);
          }

          // Remember NIP
          if (remember.checked) {
            localStorage.setItem('spkl_login_user', user.username);
          } else {
            localStorage.removeItem('spkl_login_user');
          }

          showToast(`Selamat datang, ${user.displayName}!`, true);

          // Redirect after short pause
          setTimeout(() => {
            window.location.href = 'SPKL_App.html';
          }, 900);

        } else {
          btnLabel.classList.remove('hidden');
          spinner.classList.add('hidden');
          btnLogin.disabled = false;

          wrapUser.classList.add('invalid');
          wrapPass.classList.add('invalid');
          showError('NIP atau password salah. Periksa kembali.');

          // Shake animation
          const card = document.querySelector('.login-card');
          card.style.animation = 'none';
          card.style.transform = 'translateX(6px)';
          setTimeout(() => { card.style.transform = 'translateX(-6px)'; }, 80);
          setTimeout(() => { card.style.transform = 'translateX(4px)'; },  160);
          setTimeout(() => { card.style.transform = 'translateX(0)'; },    240);
          setTimeout(() => { card.style.transition = ''; }, 250);
        }
      }

      btnLogin.addEventListener('click', handleLogin);
      
      // Submit on Enter key
      usernameEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
      passwordEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

      function showError(msg) {
        errorText.textContent = msg;
        errorMsg.classList.add('show');
      }

      function showToast(msg, isSuccess = false) {
        const toast   = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        toastMsg.textContent = msg;
        toast.classList.toggle('error', !isSuccess);
        toast.classList.remove('hidden');
        void toast.offsetWidth;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.classList.add('hidden'), 400);
        }, 2800);
      }
    </script>
  </body>
</html>
